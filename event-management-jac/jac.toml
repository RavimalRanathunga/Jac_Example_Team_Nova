[project]
name = "event-management-jac"
version = "1.0.0"
description = "Event Management Platform - full-stack Jac app with AI-assisted event planning"
entry-point = "main.jac"
kind = "web-app"

[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
clsx = "^2.1.1"
"tailwind-merge" = "^3.5.0"
"@tailwindcss/vite" = "^4.1.17"
tailwindcss = "^4.1.17"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[serve]
base_route_app = "app"

[client.app_meta_data]
title = "Event Manager"
description = "Plan, organize, and manage your events with AI-assisted checklists and budgets"
theme_color = "#4f46e5"

[byllm.model]
default_model = "gemini/gemini-3.8-flash"
